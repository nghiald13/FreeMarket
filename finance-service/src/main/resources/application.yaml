server:
  port: 8083

spring:
  profiles:
    active: dev
  application:
    name: finance-service
  threads:
    virtual:
      enabled: true
  datasource:
    url:
    username:
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 1. Bảo vệ phía Producer: Xác nhận Broker đã nhận tin nhắn
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # 2. Bảo vệ phía Consumer: Chỉ xóa tin khỏi Queue khi xử lý xong (Manual ACK)
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10 # Số lượng message tối đa lấy về bộ nhớ mỗi lần
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8081/auth/token/.well-known/jwks.json
  grpc:
    client:
      channel:
        auth-service:
          target: static://auth-service:9091
          inbound:
            keepalive:
              timeout: 40s
            message:
              max-size: 8MB

jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
  dashboard:
    enabled: true

app:
  outbox:
    enabled: true
    service-name: ${spring.application.name}
    batch-size: 50
    publisher-cron: "*/2 * * * * *"   # mỗi 2 giây
    cleanup-cron: "0 0 3 * * *"       # 3h sáng mỗi ngày
    retention-days: 7

zalopay:
  base-url: ${ZP_BASE_URL}
  app-id: ${ZP_APP_ID}
  key1: ${ZP_KEY1}
  key2: ${ZP_KEY2}
  public-key: ${ZP_PUBLIC_KEY}
  private-key: ${ZP_PRIVATE_KEY}
  webhook: ${ZP_WEBHOOK}

stripe:
  public-key: ${STRIPE_PUBLIC}
  private-key: ${STRIPE_PRIVATE}