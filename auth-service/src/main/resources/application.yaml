server:
  port: 8081

jwt:
  public-key: classpath:certs/public.pem
  private-key: classpath:certs/private.pem

spring:
  profiles:
    active: dev
  application:
    name: auth-service
  datasource:
    url:
    username:
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  # TODO This should be Notification Service on its own
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    sender: ${MAIL_SENDER}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 1. Bảo vệ phía Producer: Xác nhận Broker đã nhận tin nhắn
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    # 2. Bảo vệ phía Consumer: Chỉ xóa tin khỏi Queue khi xử lý xong (Manual ACK)
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10 # Số lượng message tối đa lấy về bộ nhớ mỗi lần
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-service:8081/token/.well-known/jwks.json

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true